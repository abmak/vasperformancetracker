# Production runtime for the VAS Performance Tracker on the VPS.
#
# Host networking (Linux) keeps everything identical to the pm2 setup:
#   - the API listens on 127.0.0.1:5001 (vas-https proxies TLS :5000 → it)
#   - the app reaches PostgreSQL at 127.0.0.1:5432, and the failover layer
#     reaches the streaming standby at 127.0.0.1:5433 (see
#     docker-compose.pg.yml, which runs both servers)
#
# Prerequisites (one-time):
#   1. Docker installed:            sudo bash scripts/docker/install-docker-vps.sh
#   2. GHCR access for the image:   see scripts/DEPLOY.md → "Docker runtime"
#      (a fine-grained PAT with read:packages, or make the package public)
#
# Cutover from pm2 (run on the VPS):
#   pm2 stop perf-tracking-api && pm2 delete perf-tracking-api
#   docker compose -f /var/www/performancetracking/app/docker-compose.yml pull
#   docker compose -f /var/www/performancetracking/app/docker-compose.yml up -d
# Rollback to pm2 at any time:
#   docker compose -f /var/www/performancetracking/app/docker-compose.yml down
#   pm2 start perf-tracking-api
#
# NOTE: the failover marker (~/pg-standby/FAILOVER, plus PROMOTED once a
# standby has been promoted) is shared with the host so the containerized app
# and the operator's scripts agree on failover state. The old ~/mysql-standby
# mount stays for the MySQL rollback window.

name: perf-tracking

services:
  app:
    image: ghcr.io/abmak/vasperformancetracker:latest
    container_name: perf-tracking-app
    network_mode: host
    env_file:
      - /var/www/performancetracking/app/backend/.env.production
    environment:
      # Inside the container $HOME is /home/node — pin these to the shared,
      # host-mounted locations so the app sees the same state as the host-side
      # failover helpers and the host-side backup scripts.
      DB_FAILOVER_MARKER: /home/feveneyasu/pg-standby/FAILOVER
      # the frequent-dump cadence the host's cron reads on every run
      DB_BACKUP_CONFIG_FILE: /home/feveneyasu/pg-standby/backup-config.json
      DB_SYNC_STATUS_FILE: /home/feveneyasu/mysql-standby/status.json
      BACKUPS_DIR: /home/feveneyasu/backups
      PORT: 5001
    volumes:
      # persistent user uploads (chat media) + ACME challenges
      - /var/www/performancetracking/app/backend/uploads:/app/backend/uploads
      - /var/www/performancetracking/app/backend/acme-challenges:/app/backend/acme-challenges
      # failover marker shared with the host-side scripts (writable: the app
      # creates the marker the moment it fails over)
      - /home/feveneyasu/pg-standby:/home/feveneyasu/pg-standby
      # legacy MySQL sync daemon status (kept for the rollback window)
      - /home/feveneyasu/mysql-standby:/home/feveneyasu/mysql-standby
      # backups (nightly dumps + standby snapshots) — read-only, the
      # System Health page only reads them
      - /home/feveneyasu/backups:/home/feveneyasu/backups:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5001/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
